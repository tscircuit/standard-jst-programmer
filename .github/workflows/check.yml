name: Validate circuits and build firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  circuits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build -- --svgs
      - run: bun run test
      - run: cc -Wall -Werror scripts/check-firmware-math.c -o /tmp/check-firmware-math && /tmp/check-firmware-math
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuits
          path: dist/
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - run: python3 -m unittest discover -s tests -v
      - run: cc -std=c11 -Wall -Wextra -Werror -Ifirmware/sbw tests/check-sbw.c firmware/sbw/protocol.c -o /tmp/check-sbw && /tmp/check-sbw
      - run: bash firmware/build.sh
      # Non-distributable build-test identity; supply authorized IDs for hardware use.
      - run: SBW_USB_VID=0xFFFF SBW_USB_PID=0xFFFF bash firmware/build-sbw.sh
      - uses: actions/upload-artifact@v4
        with:
          name: standard-jst-programmer-uf2
          path: dist/firmware/*.uf2
